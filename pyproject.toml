[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inboxshield-ai"
version = "1.0.0"
description = "Privacy-first local AI invoice auditing agent with Gemma, Ollama, and SQLite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "InboxShield AI contributors" }]
keywords = ["invoice", "audit", "ollama", "gemma", "local-ai", "sqlite"]
dependencies = [
    "pydantic>=2.9,<3",
    "Pillow>=10.4,<14",
    "PyMuPDF>=1.24,<3",
    "watchdog>=4.0,<7",
    "httpx>=0.27,<1",
    "streamlit>=1.41,<2",
    "pandas>=2.2,<4",
    "plotly>=5.24,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.6,<1"]

[tool.setuptools]
packages = ["inboxshield"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "logs", "processed_invoices", "incoming_invoices"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "DTZ"]
ignore = [
    "E501",   # handled by the formatter; long SQL/strings are intentional
    "S101",   # asserts are appropriate in tests
    "S603",   # subprocess is limited to the explicit Ollama pull helper
    "S607",   # ollama is resolved via shutil.which before subprocess use
    "B008",   # Streamlit/Pydantic patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311", "DTZ001", "DTZ005", "RUF012"]
"scripts/*" = ["S108", "T201"]
"inboxshield/dashboard/*" = ["S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: requires a running Ollama service and the configured Gemma model",
]
